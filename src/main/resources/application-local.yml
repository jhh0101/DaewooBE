spring:
  data:
    redis:
      host: localhost
      port: 16379
      database: 0
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:13306/hotels_db
    username: hotels_user
    password: hotels12345

# 파일 업로드 설정
file:
  upload:
    hotel:
      path: ./uploads/hotelimage/
      resourceHandler: /hotel-images/**
    user:
      path: ./uploads/userimage/            # 업로드 및 읽기
      resourceHandler: /user-images/**
      webPath: /user-images/
    parlor:
      path: ./uploads/parlorimage/
      resourceHandler: /parlor-images/**
# 프로젝트 기본 경로 설정 (필요한 경우)
project:
  basedir: .


#JPA log
logging:
  level:
    org:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE

cors:
  allowed-origins: http://localhost:443,http://localhost:80,http://mjc813b.softagape.com/,https://mjc813b.softagape.com/, http://localhost:8080

