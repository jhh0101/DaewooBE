spring:
  sql:
    init:
      mode: always  # ✅ 공통으로 적용 (AWS에서도 실행됨)
      encoding: UTF-8
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB
    jpa:
      hibernate:
        ddl-auto: none # ✅ schema.sql을 믿고 JPA 자동 생성은 끔 (중요)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
            redirect-uri: http://localhost:18888/login/oauth2/code/google
            scope:
              - profile
              - email
          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET}
            redirect-uri: http://localhost:18888/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Naver
            scope:
              - name
              - email
              - profile_image
          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:18888/login/oauth2/code/kakao
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  application:
    name: backend
  profiles:
    active: prod

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${USER_MAIL}
    password: ${USER_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8085
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.example.daewoo
  configuration:
    map-underscore-to-camel-case: true


jwt:
  secret: ${JWT_SECRET_KEY}

cors:
  allowed-origins: http://localhost:3000,http://tomhoon.my:780,http://localhost:3000,http://localhost:18080,http://localhost:8080,http://localhost:8085

toss:
  payment:
    clientKey: ${TOSS_PAYMENT_CLIENT_KEY}
    secretKey: ${TOSS_PAYMENT_SECRET_KEY}